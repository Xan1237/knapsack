# Ten parallel, isolated Kane smoke jobs. Recording/repair is manual.
name: Kane smoke
on:
  pull_request:
    branches:
      - main
    paths:
      - final/**
      - testing/kane/**
      - .github/workflows/kane.yml
  push:
    branches:
      - main
      - kane-cli
    paths:
      - final/**
      - testing/kane/**
      - .github/workflows/kane.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Browser suite (pushes and PRs always use smoke)
        type: choice
        options:
          - smoke
          - regression
          - live
          - all
        default: smoke
      mode:
        description: Check replays strictly; record creates or repairs recordings
        type: choice
        options:
          - check
          - record
        default: check
      application_ref:
        description: Application branch or commit to test; blank uses this run's commit
        type: string
        default: ""
      application_directory:
        description: Application folder in that branch
        type: choice
        options:
          - final
          - .
        default: final
      test_id:
        description: Optional single test ID from the chosen suite
        type: string
        default: ""
      recording_run_id:
        description: Optional successful trusted Kane run for recording promotion
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: kane-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'check' }}-${{ inputs.suite || 'smoke' }}-${{ inputs.application_ref }}-${{ inputs.test_id }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
  KANE_CLI_USER_AGENT: codex
  KANE_APP_DIR: ${{ github.workspace }}/application/${{ inputs.application_directory || 'final' }}
  KANE_BASE_URL: http://127.0.0.1:3000
  KANE_SUITE: ${{ inputs.suite || 'smoke' }}
  KANE_MODE: ${{ inputs.mode || 'check' }}
  KANE_TEST_ID: ${{ inputs.test_id || '' }}
  KANE_RECORDING_SEED: ${{ inputs.recording_run_id || vars.KANE_RECORDING_RUN_ID || '' }}
jobs:
  build:
    name: Build and source checks
    runs-on: ubuntu-24.04
    outputs:
      application_sha: ${{ steps.application-ref.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out application separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.application_ref || github.sha }}
          path: application
          persist-credentials: false
      - name: Record exact application commit
        working-directory: application
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: application-ref
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            testing/kane/package-lock.json
            application/${{ inputs.application_directory || 'final' }}/package-lock.json
      - name: Install harness
        working-directory: testing/kane
        run: npm ci --no-audit --no-fund
      - name: Validate workflow and suites
        working-directory: testing/kane
        run: npm run check
      - name: Test the CI harness
        working-directory: testing/kane
        run: npm test
      - name: Select one matrix job per Kane test
        id: matrix
        working-directory: testing/kane
        run: node scripts/matrix.mjs
      - name: Install application
        working-directory: ${{ env.KANE_APP_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Restore Next build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.KANE_APP_DIR }}/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('application/final/package-lock.json', 'application/package-lock.json') }}-${{ hashFiles('application/final/src/**', 'application/src/**', 'application/final/next.config.*', 'application/next.config.*') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('application/final/package-lock.json', 'application/package-lock.json') }}-
      - name: Lint application
        working-directory: ${{ env.KANE_APP_DIR }}
        run: npm run lint
      - name: Test application
        working-directory: ${{ env.KANE_APP_DIR }}
        run: npm test
      - name: Build application (includes TypeScript checks)
        working-directory: ${{ env.KANE_APP_DIR }}
        run: npm run build
      - name: Share the exact production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kane-application-build
          path: |-
            ${{ env.KANE_APP_DIR }}/.next
            !${{ env.KANE_APP_DIR }}/.next/cache
          include-hidden-files: true
          retention-days: 1
  browser:
    name: Smoke - ${{ matrix.label }}
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      KANE_APPLICATION_REF: ${{ needs.build.outputs.application_sha }}
      KANE_TEST_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out the exact application build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.build.outputs.application_sha }}
          path: application
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            testing/kane/package-lock.json
            application/${{ inputs.application_directory || 'final' }}/package-lock.json
      - name: Install harness
        working-directory: testing/kane
        run: npm ci --no-audit --no-fund
      - name: Install application runtime dependencies
        working-directory: ${{ env.KANE_APP_DIR }}
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Restore production build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: kane-application-build
          path: ${{ env.KANE_APP_DIR }}/.next
      - name: Require credentials without printing values
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "const names=['LT_USERNAME','LT_ACCESS_KEY']; if(['live','all'].includes(process.env.KANE_SUITE)) names.push('OPENAI_API_KEY'); for(const name of names) if(!process.env[name]) { console.error('Missing repository secret: '+name); process.exitCode=2; }"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4
        with:
          chrome-version: stable
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Restore managed Kane runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cache/v16-runner
            ~/.local/share/v16-runner
          key: kane-runtime-${{ runner.os }}-${{ hashFiles('testing/kane/package-lock.json') }}
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Restore approved recordings
        id: recordings
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |-
            testing/kane/.testmuai/tests/output-${{ matrix.id }}
            testing/kane/.testmuai/recordings.json
          key: kane-matrix-v1-${{ runner.os }}-${{ hashFiles('testing/kane/recording-version.txt', 'testing/kane/package-lock.json') }}-${{ matrix.id }}-${{ matrix.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |-
            kane-matrix-v1-${{ runner.os }}-${{ hashFiles('testing/kane/recording-version.txt', 'testing/kane/package-lock.json') }}-${{ matrix.id }}-${{ matrix.hash }}-
            kane-matrix-v1-${{ runner.os }}-${{ hashFiles('testing/kane/recording-version.txt', 'testing/kane/package-lock.json') }}-${{ matrix.id }}-
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Verify trusted recording seed
        id: seed
        if: env.KANE_RECORDING_SEED != '' && steps.recordings.outputs.cache-matched-key == ''
        working-directory: testing/kane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-seed.mjs
      - name: Import approved recordings from the successful seed run
        if: env.KANE_RECORDING_SEED != '' && steps.recordings.outputs.cache-matched-key == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: kane-recording-${{ matrix.id }}
          path: testing/kane/.testmuai
          github-token: ${{ github.token }}
          run-id: ${{ steps.seed.outputs.run_id }}
      - name: Run Kane against the production server
        id: kane
        working-directory: testing/kane
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ (inputs.suite == 'live' || inputs.suite == 'all') && secrets.OPENAI_API_KEY || '' }}
          KANE_CLI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run run -- --start-server --headless --parallel 1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Cache recordings after a successful trusted test
        if: always() && steps.kane.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |-
            testing/kane/.testmuai/tests/output-${{ matrix.id }}
            testing/kane/.testmuai/recordings.json
          key: ${{ steps.recordings.outputs.cache-primary-key }}
      - name: Upload Kane result and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kane-${{ matrix.id }}-${{ env.KANE_MODE }}-${{ github.run_attempt }}
          path: |
            testing/kane/results/
            testing/kane/.testmuai/evidence/*.evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Publish verified recording for branch promotion
        if: always() && steps.kane.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kane-recording-${{ matrix.id }}
          path: |-
            testing/kane/.testmuai/tests/output-${{ matrix.id }}
            testing/kane/.testmuai/recordings.json
          include-hidden-files: true
          retention-days: 7
