services:
  knapsack:
    image: knapsack:${KNAPSACK_IMAGE_TAG:-local}
    build:
      context: ..
    init: true
    restart: unless-stopped
    environment:
      WAITLIST_ONLY: "true"
      WAITLIST_DATA_DIR: /var/lib/knapsack
    volumes:
      - knapsack_waitlist:/var/lib/knapsack
    ports:
      - "${KNAPSACK_BIND_ADDRESS:-127.0.0.1}:3100:3000"

volumes:
  knapsack_waitlist:
